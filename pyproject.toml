[project]
name = "antenna-paper-extraction"
version = "0.1.0"
description = "Evidence-grounded extraction of antenna architecture and reported results from scientific papers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "tzdata>=2026.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
